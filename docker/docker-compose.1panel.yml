version: '3.8'

# UpdateHub 1Panel 专用部署配置
# 使用预构建的Docker镜像，避免在服务器端构建

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: updatehub-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: updatehub
      POSTGRES_USER: updatehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-updatehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/UpdateHub/backups/postgres:/backups
    ports:
      - "5432:5432"
    networks:
      - updatehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U updatehub -d updatehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: updatehub-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    env_file:
      - .env
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - updatehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务 - 使用预构建镜像
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-username/updatehub-backend:latest}
    container_name: updatehub-backend
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=updatehub
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-updatehub}
      - DATABASE_NAME=updatehub
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
      - SERVER_MODE=${SERVER_MODE:-release}
      - SERVER_PORT=${SERVER_PORT:-8080}
    volumes:
      - /opt/UpdateHub/backend/uploads:/root/uploads
      - /opt/UpdateHub/backend/configs:/root/configs
      - /opt/UpdateHub/backups/uploads:/backups
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - updatehub-network
    restart: unless-stopped

  # 前端服务 - 使用预构建镜像
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/your-username/updatehub-frontend:latest}
    container_name: updatehub-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - updatehub-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  updatehub-network:
    driver: bridge
