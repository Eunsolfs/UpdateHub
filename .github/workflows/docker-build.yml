name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Convert username to lowercase
      id: lowercase
      run: echo "username=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.backend
        push: true
        tags: |
          ghcr.io/${{ steps.lowercase.outputs.username }}/updatehub-backend:latest
          ghcr.io/${{ steps.lowercase.outputs.username }}/updatehub-backend:${{ github.ref_name }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.frontend
        push: true
        tags: |
          ghcr.io/${{ steps.lowercase.outputs.username }}/updatehub-frontend:latest
          ghcr.io/${{ steps.lowercase.outputs.username }}/updatehub-frontend:${{ github.ref_name }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
