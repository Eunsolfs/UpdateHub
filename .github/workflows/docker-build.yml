name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ toLower(github.repository_owner) }}/updatehub-backend

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.backend
        push: true
        tags: |
          ghcr.io/${{ toLower(github.repository_owner) }}/updatehub-backend:latest
          ghcr.io/${{ toLower(github.repository_owner) }}/updatehub-backend:${{ github.ref_name }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ toLower(github.repository_owner) }}/updatehub-frontend

    - name: Build and push frontend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.frontend
        push: true
        tags: |
          ghcr.io/${{ toLower(github.repository_owner) }}/updatehub-frontend:latest
          ghcr.io/${{ toLower(github.repository_owner) }}/updatehub-frontend:${{ github.ref_name }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
